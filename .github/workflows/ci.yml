name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-compile:
    name: Lint and Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TypeScript
        run: yarn lint
        continue-on-error: true

      - name: Compile TypeScript
        run: yarn compile

      - name: Check for compilation errors
        run: |
          if [ ! -f "out/extension.js" ]; then
            echo "❌ Compilation failed - extension.js not found"
            exit 1
          fi
          echo "✅ Compilation successful"

  # A release builds the language server at the rev package.json pins
  # (`comline.languageServer.rev`). Catch a pin that isn't on GitHub here, in
  # review, rather than at tag time.
  language-server-pin:
    name: Language server pin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: The pinned rev must exist
        run: |
          rev=$(node -p "require('./package.json').comline.languageServer.rev")
          echo "language-server $rev"
          git init -q pin-check
          git -C pin-check fetch -q --depth 1 https://github.com/ComlineProject/language-server "$rev" \
            || { echo "::error::language-server rev $rev is not on GitHub"; exit 1; }

  package-test:
    name: Package Test
    runs-on: ubuntu-latest
    needs: lint-and-compile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile TypeScript
        run: yarn compile

      - name: Test packaging (without binaries)
        run: npx vsce package --yarn

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: test-vsix
          path: '*.vsix'
          retention-days: 7
