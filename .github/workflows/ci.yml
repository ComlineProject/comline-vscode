name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# A newer push to the same pull request supersedes this run; a branch's runs
# queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint-and-compile:
    name: Lint and Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TypeScript
        run: yarn lint
        continue-on-error: true

      - name: Compile TypeScript
        run: yarn compile

      - name: Check for compilation errors
        run: |
          if [ ! -f "out/extension.js" ]; then
            echo "Compilation failed - extension.js not found"
            exit 1
          fi
          echo "Compilation successful"

  # A release builds the language server at the rev package.json pins
  # (`comline.languageServer.rev`). Catch a pin that isn't on GitHub here, in
  # review, rather than at tag time.
  language-server-pin:
    name: Language server pin
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned rev must exist
        run: |
          rev=$(node -p "require('./package.json').comline.languageServer.rev")
          echo "language-server $rev"
          git init -q pin-check
          git -C pin-check fetch -q --depth 1 https://github.com/ComlineProject/language-server "$rev" \
            || { echo "::error::language-server rev $rev is not on GitHub"; exit 1; }

      # Advisory: a warning annotation, never a failure. A pin that is behind
      # is how the bundled server came to reject grammar the CLI accepts
      # (#32), and Renovate opens the bump; this puts it in front of whoever
      # is changing the repo meanwhile.
      - name: The pin should be current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev=$(node -p "require('./package.json').comline.languageServer.rev")
          # `comline-core = { git = "...", rev = "<sha>" }` in a Cargo.toml.
          core_rev() { sed -nE 's/^comline-core[[:space:]]*=.*rev[[:space:]]*=[[:space:]]*"([0-9a-f]{40})".*/\1/p' | head -n 1; }

          # 1. Behind language-server's default branch?
          branch=$(gh api repos/ComlineProject/language-server --jq .default_branch) || branch=
          behind=
          if [ -n "$branch" ]; then
            behind=$(gh api "repos/ComlineProject/language-server/compare/$rev...$branch" --jq .ahead_by) || behind=
          fi
          if [ -z "$behind" ]; then
            echo "::warning title=Language server pin::Could not compare $rev with language-server's default branch."
          elif [ "$behind" -gt 0 ]; then
            echo "::warning title=Language server pin::comline.languageServer.rev ${rev:0:7} is $behind commit(s) behind language-server's $branch. The bundled server may reject what the CLI accepts; bump the pin (Renovate opens the pull request)."
          else
            echo "The pin ${rev:0:7} is language-server's $branch."
          fi

          # 2. The pinned server's comline-core vs the CLI's (its default
          # branch, which is what `cargo install --git` gives). The server has
          # no committed Cargo.lock, so both are read from the Cargo.toml.
          server_core=$(git -C pin-check show FETCH_HEAD:Cargo.toml | core_rev) || server_core=
          cli_core=$(gh api repos/ComlineProject/cli/contents/Cargo.toml -H 'Accept: application/vnd.github.raw+json' | core_rev) || cli_core=
          if [ -z "$server_core" ] || [ -z "$cli_core" ]; then
            echo "::warning title=Language server pin::Could not read comline-core's rev from the pinned language server (${server_core:-none}) or the CLI (${cli_core:-none})."
          elif [ "$server_core" != "$cli_core" ]; then
            echo "::warning title=Language server pin::The pinned language server was built with comline-core ${server_core:0:7}, the CLI's default branch uses ${cli_core:0:7}. Diagnostics may differ from what comline generation reports."
          else
            echo "The pinned server and the CLI both use comline-core ${server_core:0:7}."
          fi

  # The keys of `config.idp` (completion and hover in a `.idp`) are core's: core
  # keeps a table of what its reader takes, held to the reader by its tests, and
  # `src/idpSchema.generated.json` is that file at the rev `package.json` pins
  # (`comline.idpSchema.rev`). Fails when the committed copy is not what the pin
  # generates, or the pin is not on GitHub.
  idp-schema:
    name: Config schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2

      - name: The committed schema must be core's at the pinned rev
        run: node scripts/sync-idp-schema.mjs

      # Advisory, like the language-server pin's: core changing what
      # `config.idp` takes doesn't fail anything here, so say when the pin is
      # behind core's default branch. A failed lookup is a warning too.
      - name: The pin should be current
        run: |
          url=https://raw.githubusercontent.com/ComlineProject/core/HEAD/schemas/config-idp.json
          if ! curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/config-idp.json"; then
            echo "::warning::couldn't fetch core's schemas/config-idp.json to check the pin"
          elif cmp -s "$RUNNER_TEMP/config-idp.json" src/idpSchema.generated.json; then
            echo "The pinned schema is core's current one."
          else
            echo "::warning file=package.json::core's schemas/config-idp.json has changed since comline.idpSchema.rev: bump the pin and run 'node scripts/sync-idp-schema.mjs --write'"
          fi

  package-test:
    name: Package Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint-and-compile

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile TypeScript
        run: yarn compile

      - name: Unit tests
        run: yarn test

      - name: Test packaging (without binaries)
        run: npx vsce package --yarn

      - name: Upload test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-vsix
          path: '*.vsix'
          retention-days: 7
