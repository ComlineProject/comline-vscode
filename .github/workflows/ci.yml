name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# A newer push to the same pull request supersedes this run; a branch's runs
# queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint-and-compile:
    name: Lint and Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TypeScript
        run: yarn lint
        continue-on-error: true

      - name: Compile TypeScript
        run: yarn compile

      - name: Check for compilation errors
        run: |
          if [ ! -f "out/extension.js" ]; then
            echo "Compilation failed - extension.js not found"
            exit 1
          fi
          echo "Compilation successful"

  # A release builds the language server at the rev package.json pins
  # (`comline.languageServer.rev`). Catch a pin that isn't on GitHub here, in
  # review, rather than at tag time.
  language-server-pin:
    name: Language server pin
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned rev must exist
        run: |
          rev=$(node -p "require('./package.json').comline.languageServer.rev")
          echo "language-server $rev"
          git init -q pin-check
          git -C pin-check fetch -q --depth 1 https://github.com/ComlineProject/language-server "$rev" \
            || { echo "::error::language-server rev $rev is not on GitHub"; exit 1; }

  package-test:
    name: Package Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint-and-compile

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile TypeScript
        run: yarn compile

      - name: Test packaging (without binaries)
        run: npx vsce package --yarn

      - name: Upload test package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-vsix
          path: '*.vsix'
          retention-days: 7
