name: Release Extension

# One workflow, four kinds of run (scripts/release-meta.sh decides which; see
# RELEASING.md):
#
#   tag vX.Y.Z         stable: GitHub release + Open VSX
#   tag vX.Y.Z-rc.1…   pre:    GitHub prerelease, never published
#   push to main       dev:    CI tags vX.Y.Z-dev.N, GitHub prerelease, never
#                              published; only the newest 10 are kept
#   manual dispatch    dry:    build, test and package; no release
#
#   pull request       dry:    the same, when the change touches the build; no
#                              release, and the Open VSX token is never in reach
#
# Every kind builds, smoke-tests and packages the same six packages.
#
# Only `release` and `prune-dev` write to the repository, and only
# `publish-openvsx` has the Open VSX token; the last runs for a stable tag
# push and nothing else.

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
      # dev tags are created by this workflow, never pushed to start it
      - "!v*-dev.*"
  workflow_dispatch:
  # A change to the build is proven by a dry run before it merges. Not the
  # whole tree: the language server pin (package.json) and the build's own
  # files, which is what can break a release.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
      - "yarn.lock"
      - ".vscodeignore"
      - "scripts/**"

permissions:
  contents: read

# A release that has started is never cancelled. Only a superseded pull
# request run is.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      rev: ${{ steps.pin.outputs.rev }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-meta.sh counts commits and reads tags
          fetch-depth: 0
          persist-credentials: false

      - name: What kind of run is this?
        id: meta
        # Not `| tee`: the default shell has no pipefail, so a refusal from the
        # script would vanish behind tee's success.
        run: |
          scripts/release-meta.sh > meta.txt
          cat meta.txt
          cat meta.txt >> "$GITHUB_OUTPUT"
          echo "--- notes.md"
          cat notes.md 2>/dev/null || echo "(none: nothing to build)"

      - name: The pinned language-server rev must exist
        id: pin
        run: |
          rev=$(node -p "require('./package.json').comline.languageServer.rev")
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "language-server $rev"
          git init -q pin-check
          git -C pin-check fetch -q --depth 1 https://github.com/ComlineProject/language-server "$rev" \
            || { echo "::error::language-server rev $rev is not on GitHub"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.meta.outputs.channel != 'skip'
        with:
          name: release-notes
          path: notes.md

  build:
    name: Build comline-lsp (${{ matrix.target }})
    needs: validate
    if: needs.validate.outputs.channel != 'skip'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Linux builds in the tools image (Rust 1.99.1, the native musl target and
    # musl-gcc, binutils); macOS and Windows have no container.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is static musl: no glibc floor, so it runs on any distro.
          - target: linux-x64
            rust: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            container: ghcr.io/comlineproject/ci-tools@sha256:b9301f9caf3e47f0b839de85efda178f698a55daf7fc387b463adeec93ecd433
            musl: true
          - target: linux-arm64
            rust: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            container: ghcr.io/comlineproject/ci-tools@sha256:b9301f9caf3e47f0b839de85efda178f698a55daf7fc387b463adeec93ecd433
            musl: true
          - target: darwin-arm64
            rust: aarch64-apple-darwin
            os: macos-15
            container: ""
          # Cross-compiled on the arm64 runner, smoke-tested under Rosetta.
          - target: darwin-x64
            rust: x86_64-apple-darwin
            os: macos-15
            container: ""
            rosetta: true
          - target: win32-x64
            rust: x86_64-pc-windows-msvc
            os: windows-2025
            container: ""
            exe: .exe
    steps:
      - name: Harden the runner
        if: matrix.container == ''
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout extension (for the smoke test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout language-server at the pinned rev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ComlineProject/language-server
          ref: ${{ needs.validate.outputs.rev }}
          path: language-server
          persist-credentials: false

      # Keep in step with the tools image, which has the same toolchain.
      - name: Rust toolchain
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust }}

      # musl-gcc is in the tools image.
      - name: musl C compiler
        if: matrix.musl
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: |
          # comline-core compiles its tree-sitter grammar from C at build time.
          echo "CC_${RUST_TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: language-server
          key: ${{ matrix.rust }}

      - name: Build
        working-directory: language-server
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: cargo build --release --target "$RUST_TARGET"

      - name: Stage the binary
        env:
          RUST_TARGET: ${{ matrix.rust }}
          EXE: ${{ matrix.exe }}
        run: |
          mkdir -p out
          cp "language-server/target/$RUST_TARGET/release/comline-lsp$EXE" out/
          ls -l out/

      # A static binary has no program interpreter (no PT_INTERP header).
      - name: Linux binary must be static
        if: matrix.musl
        run: |
          readelf -lW out/comline-lsp | grep -E 'Type|INTERP|DYNAMIC' || true
          if readelf -lW out/comline-lsp | grep -q INTERP; then
            echo "::error::comline-lsp is dynamically linked"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2

      - name: Rosetta
        if: matrix.rosetta
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Smoke test
        env:
          EXE: ${{ matrix.exe }}
          SMOKE_ARGS: ${{ matrix.rosetta && '--arch-x86_64' || '' }}
        run: |
          # shellcheck disable=SC2086
          node scripts/smoke-lsp.mjs "out/comline-lsp$EXE" $SMOKE_ARGS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lsp-${{ matrix.target }}
          path: out/comline-lsp${{ matrix.exe }}
          if-no-files-found: error

  package:
    name: Package (${{ matrix.target }})
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `universal` carries no binary: the fallback an editor installs on any
        # platform not listed, where the user points comline.server.* at a
        # comline-lsp of their own.
        target: [linux-x64, linux-arm64, darwin-arm64, darwin-x64, win32-x64, universal]
    env:
      VSIX: comline-vscode-${{ needs.validate.outputs.version }}-${{ matrix.target }}.vsix
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2
          cache: yarn

      - run: yarn install --frozen-lockfile

      # A dev or pre build carries its own version (0.1.1-dev.4, 0.2.0-rc.1);
      # for stable and dry runs this is package.json's version already.
      - name: Set the version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Place the binary
        if: matrix.target != 'universal'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lsp-${{ matrix.target }}
          path: bin/${{ matrix.target }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x bin/*/comline-lsp 2>/dev/null || true
          if [ "$TARGET" = universal ]; then
            npx vsce package --yarn -o "$VSIX"
          else
            npx vsce package --yarn --target "$TARGET" -o "$VSIX"
          fi

      - name: Verify the package holds exactly its own binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          found=$(unzip -Z1 "$VSIX" | grep -E '(^|/)comline-lsp(\.exe)?$' || true)
          echo "binaries in $VSIX: ${found:-(none)}"
          if [ "$TARGET" = universal ]; then
            [ -z "$found" ] || { echo "::error::the universal package must carry no binary"; exit 1; }
          else
            name=comline-lsp; [ "$TARGET" = win32-x64 ] && name=comline-lsp.exe
            [ "$found" = "extension/bin/$TARGET/$name" ] \
              || { echo "::error::expected exactly extension/bin/$TARGET/$name"; exit 1; }
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: ${{ env.VSIX }}
          if-no-files-found: error

  release:
    name: GitHub release
    if: contains(fromJSON('["stable", "pre", "dev"]'), needs.validate.outputs.channel)
    needs: [validate, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Never on a pull request: its channel is `dry`.
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Checksums
        working-directory: dist
        run: sha256sum *.vsix | tee SHA256SUMS

      - name: Create the release (or refresh its assets on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          case $CHANNEL in
            # a human pushed this tag; it must already exist
            stable) flags=(--verify-tag --latest) ;;
            pre) flags=(--verify-tag --prerelease --latest=false) ;;
            # CI creates the tag, on exactly the commit it built
            dev) flags=(--target "$GITHUB_SHA" --prerelease --latest=false) ;;
          esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file notes.md "${flags[@]}"

  prune-dev:
    name: Prune old dev prereleases
    if: needs.validate.outputs.channel == 'dev'
    needs: [validate, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Only `-dev.N` prereleases; stable releases and -rc/-beta prereleases
      # are never touched. Deletes the tag with the release.
      - name: Keep the newest ${{ env.KEEP }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.[0-9]+$")))]
                  | sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' > stale.txt
          if [ ! -s stale.txt ]; then
            echo "nothing to prune"
            exit 0
          fi
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < stale.txt

  publish-openvsx:
    name: Publish to Open VSX
    # A stable tag pushed by a person, and nothing else: the token is not
    # reachable from a pull request, a manual run or a dev build.
    if: >-
      needs.validate.outputs.channel == 'stable'
      && github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2

      # Fetched without the token in reach, and without install scripts.
      - name: Install ovsx
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/ovsx" ovsx@1.3.0

      - name: Publish every package
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::secret OVSX_PAT is not set - see RELEASING.md"
            exit 1
          fi
          # --skip-duplicate: a re-run after a partial failure skips what landed.
          for f in dist/*.vsix; do
            echo "publishing $f"
            "$RUNNER_TEMP/ovsx/node_modules/.bin/ovsx" publish --packagePath "$f" --skip-duplicate -p "$OVSX_PAT"
          done
